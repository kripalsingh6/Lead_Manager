databases:
  - name: lead-manager-db
    databaseName: lead_manager
    user: lead_user
    plan: free
    region: oregon

services:
  - type: web
    name: lead-manager-backend
    env: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lead-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: DB_SSL
        value: "true"
