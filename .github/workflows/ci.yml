name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  frontend-verification:
    name: Frontend Build & Static Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Verify Production Client Build
        working-directory: ./Frontend
        run: npm run build

  backend-test-and-security:
    name: Backend API, Security & Regression Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: lead_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run End-to-End Test Suite (Health, Auth, Leads, OWASP Security)
        working-directory: ./Backend
        env:
          NODE_ENV: test
          PORT: 5001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: lead_manager_test
          JWT_SECRET: ci_super_secret_jwt_key_testing_environment_only_12345
          CORS_ORIGIN: http://localhost:3000
        run: npm test

      - name: Run Concurrency & Benchmark Verification
        working-directory: ./Backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: lead_manager_test
          JWT_SECRET: ci_super_secret_jwt_key_testing_environment_only_12345
          CORS_ORIGIN: http://localhost:3000
        run: node tests/benchmark.js

